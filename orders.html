<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders | Me To You Designs</title>

    <link rel="stylesheet" href="orders.css">

</head>

<body>

<div class="page">

    <header class="top-header">

        <button
            class="back-button"
            onclick="window.location.href='dashboard.html'">

            ← Dashboard

        </button>

        <img
            src="logo.png"
            class="logo"
            alt="Me To You Designs">

        <h1>📦 Orders</h1>

        <p>

            View, search and manage every customer order.

        </p>

    </header>

    <section class="search-card">

        <input
            type="text"
            id="searchOrders"
            placeholder="🔍 Search by customer, phone or order number...">

    </section>

    <section class="filter-card">

        <select id="statusFilter">

            <option value="all">All Orders</option>

            <option value="New Order">New Orders</option>

            <option value="Designing">Designing</option>

            <option value="Making">Making</option>

            <option value="Ready">Ready</option>

            <option value="Completed">Completed</option>

        </select>

        <select id="sortOrders">

            <option value="newest">Newest First</option>

            <option value="oldest">Oldest First</option>

            <option value="due">Due Soon</option>

            <option value="payment">Outstanding Payments</option>

        </select>

    </section>

    <section
        id="ordersContainer"
        class="orders-container">
              <div
            id="noOrdersMessage"
            class="no-orders">

            <h2>📦 No Orders Yet</h2>

            <p>

                Your saved orders will appear here.

            </p>

            <button
                class="new-order-button"
                onclick="window.location.href='add-order.html'">

                💗 Create Your First Order

            </button>

        </div>

    </section>

</div>

<script src="orders.js"></script>

</body>

</html>
