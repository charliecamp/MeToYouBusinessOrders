<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create New Order</title>

<link rel="stylesheet" href="add-order.css">

<!-- Luxury font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>


<!-- Top Header -->

<header class="order-header">

<button class="back-btn" onclick="window.location.href='dashboard.html'">
← Back
</button>

<img src="logo.PNG" class="header-logo" alt="Me To You Designs">

</header>



<main>


<h1 class="page-title">
Create New Order
</h1>

<div class="heart">
♡
</div>



<!-- CUSTOMER DETAILS -->

<section class="order-card">

<h2>
👤 Customer Details
</h2>


<label>
Customer Name
</label>

<input id="customerName" type="text" placeholder="Customer name">


<label>
Customer Contact
</label>

<input id="customerContact" type="text" placeholder="Phone number or email">


<label>
Where Ordered From
</label>

<select id="orderSource">

<option>Facebook</option>
<option>Instagram</option>
<option>TikTok</option>
<option>Website</option>
<option>Other</option>

</select>


<input
id="socialUsername"
type="text"
placeholder="@username">


</section>



<!-- ITEMS -->

<section class="order-card">

<h2>
📦 Items Ordered
</h2>


<div id="items">


<div class="item-box">


<h3>
📦 Item
</h3>


<label>
Product
</label>

<input id="product" type="text" placeholder="Example: Balloon Arch">


<label>
Quantity
</label>

<input id="quantity" type="number" value="1">


<label>
Price (£)
</label>

<input id="price" type="number" value="0">


<label>
Size (optional)
</label>

<input id="size" type="text">


<label>
Colour / Theme
</label>

<input id="colour" type="text">


<label>
Personalised?
</label>

<select id="personalised" onchange="togglePersonalisation()">
    <option value="No">No</option>
    <option value="Yes">Yes</option>
</select>

<div id="personalisationBox" style="display:none; margin-top:15px;">

    <label>Personalisation Details</label>

    <textarea
        id="personalisationDetails"
        placeholder="Enter the name, message or personalisation required..."
    ></textarea>

</div>


<button class="remove-item">
❌ Remove Item
</button>


</div>


</div>


<button class="add-item">
＋ Add Another Item
</button>


</section>



<!-- ORDER DETAILS -->

<section class="order-card">


<h2>
📝 Order Details
</h2>


<label>
Order Number
</label>

<input 
type="text" 
value="MTYD-0001"
readonly>



<label>
Order Date
</label>

<input type="date">



<label>
Date Needed By
</label>

<input type="date">



<label>
Upload Customer Images
</label>

<input type="file" multiple>



<label>
Upload Mock Ups
</label>

<input type="file" multiple>



<label>
Order Notes
</label>

<textarea placeholder="Anything the customer has requested..."></textarea>



</section>
<!-- PAYMENT SECTION -->

<section class="order-card">

<h2>
💷 Payment
</h2>


<label>
Total (£)
</label>
  
<input
    type="number"
    id="orderTotal"
    value="0"
    readonly>

<label>
Payment Status
</label>

<select id="paymentStatus">

<option>Not Paid</option>
<option>Deposit Paid</option>
<option>Paid In Full</option>

</select>



<label>
Deposit (£)
</label>

<input 
type="number"
id="depositAmount"
value="0">



<label>
Remaining Balance (£)
</label>

<input 
type="number"
id="remainingBalance"
value="0"
readonly>



<label>
Payment Method
</label>

<select id="paymentMethod">

<option>Cash</option>
<option>Bank Transfer</option>
<option>Card</option>
<option>PayPal</option>
<option>Other</option>

</select>


</section>




<select id="deliveryMethod">

<option>Collection</option>
<option>Local Delivery</option>
<option>Royal Mail</option>
<option>Evri</option>
<option>InPost</option>

</select>


<div id="trackingBox" style="display:none;">

<label>
Tracking Number
</label>

<input
type="text"
id="trackingNumber"
placeholder="Enter tracking number">

</div>


</section>





<!-- ORDER STATUS TRACKER -->


<section class="order-card">


<h2>
✨ Order Progress
</h2>



<div class="progress-tracker">


<div class="progress-step active">

<span>📝</span>
<p>New Order</p>

</div>



<div class="progress-step">

<span>🎨</span>
<p>Designing</p>

</div>



<div class="progress-step">

<span>🛠️</span>
<p>Making</p>

</div>



<div class="progress-step">

<span>📦</span>
<p>Ready</p>

</div>



<div class="progress-step">

<span>✅</span>
<p>Completed</p>

</div>


</div>


</section>





<!-- SAVE BUTTON -->


<button class="save-order">

💗 Save Order

</button>



</main>


<script src="add-order.js"></script>


</body>
</html>
