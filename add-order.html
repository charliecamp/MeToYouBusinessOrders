<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create New Order</title>

<link rel="stylesheet" href="add-order.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

</head>

<body>

<header class="order-header">

<button
class="back-btn"
onclick="window.location.href='dashboard.html'">

← Back

</button>

<img
src="logo.PNG"
class="header-logo"
alt="Me To You Designs">

</header>

<main>

<h1 class="page-title">
Create New Order
</h1>

<div class="heart">
♡
</div>

<!-- ========================= -->
<!-- CUSTOMER DETAILS -->
<!-- ========================= -->

<section class="order-card">

<h2>👤 Customer Details</h2>

<label for="customerName">Customer Name</label>

<input
id="customerName"
type="text"
placeholder="Customer name">

<label for="customerContact">
Customer Contact
</label>

<input
id="customerContact"
type="text"
placeholder="Phone number or email">

<label for="orderSource">
Where Ordered From
</label>

<select id="orderSource">

<option value="Facebook">Facebook</option>
<option value="Instagram">Instagram</option>
<option value="TikTok">TikTok</option>
<option value="Website">Website</option>
<option value="Other">Other</option>

</select>

<label for="socialUsername">
Social Username
</label>

<input
id="socialUsername"
type="text"
placeholder="@username">

</section>

<!-- ========================= -->
<!-- ITEMS -->
<!-- ========================= -->

<section class="order-card">

<h2>📦 Items Ordered</h2>

<div id="items">
<div class="item-card">

<h3>📦 Item</h3>

<label>Product</label>

<input
type="text"
class="item-product"
placeholder="Example: Balloon Arch">

<label>Quantity</label>

<input
type="number"
class="item-quantity"
value="1"
min="1">

<label>Price (£)</label>

<input
type="number"
class="item-price"
value="0"
min="0"
step="0.01">

<label>Size (Optional)</label>

<input
type="text"
class="item-size"
placeholder="Example: Large">

<label>Colour / Theme</label>

<input
type="text"
class="item-colour"
placeholder="Example: Bluey">

<label>Personalised?</label>

<select class="item-personalised">

<option value="No">No</option>
<option value="Yes">Yes</option>

</select>

<div
class="personalisation-section"
style="display:none;">

<label>Personalisation Details</label>

<textarea
class="item-personalisation"
placeholder="Name, message or wording required..."></textarea>

</div>

<button
type="button"
class="remove-item">

❌ Remove Item

</button>

</div>

</div>

<button
type="button"
class="add-item">

＋ Add Another Item

</button>

</section>
<!-- ========================= -->
<!-- ORDER DETAILS -->
<!-- ========================= -->

<section class="order-card">

<h2>📝 Order Details</h2>

<label>Order Number</label>

<input
id="orderNumber"
type="text"
value="Will be assigned when saved"
readonly>

<label>Order Date</label>

<input
id="orderDate"
type="date">

<label>Date Needed By</label>

<input
id="dateNeeded"
type="date">

<label>Upload Customer Images</label>

<input
id="customerImages"
type="file"
multiple>

<label>Upload Mock Ups</label>

<input
id="mockupImages"
type="file"
multiple>

<label>Order Notes</label>

<textarea
id="orderNotes"
placeholder="Anything the customer has requested..."></textarea>

</section>

<!-- ========================= -->
<!-- PAYMENT -->
<!-- ========================= -->

<section class="order-card">

<h2>💷 Payment</h2>

<label>Total (£)</label>

<input
id="orderTotal"
type="number"
value="0"
readonly>

<label>Payment Status</label>

<select id="paymentStatus">

<option>Not Paid</option>
<option>Deposit Paid</option>
<option>Paid In Full</option>

</select>

<label>Deposit (£)</label>

<input
id="depositAmount"
type="number"
value="0">

<label>Remaining Balance (£)</label>

<input
id="remainingBalance"
type="number"
value="0"
readonly>

<label>Payment Method</label>

<select id="paymentMethod">

<option>Cash</option>
<option>Bank Transfer</option>
<option>Card</option>
<option>PayPal</option>
<option>Other</option>

</select>

</section>

<!-- ========================= -->
<!-- DELIVERY -->
<!-- ========================= -->

<section class="order-card">

<h2>🚚 Delivery</h2>

<label>Delivery Method</label>

<select id="deliveryMethod">

<option>Collection</option>
<option>Local Delivery</option>
<option>Royal Mail</option>
<option>Evri</option>
<option>InPost</option>

</select>

<div
id="trackingBox"
style="display:none;">

<label>Tracking Number</label>

<input
id="trackingNumber"
type="text"
placeholder="Enter tracking number">

</div>

</section>

<!-- ========================= -->
<!-- ORDER PROGRESS -->
<!-- ========================= -->

<section class="order-card">

<h2>✨ Order Progress</h2>

<div class="progress-tracker">

<div class="progress-step active">
<span>📝</span>
<p>New Order</p>
</div>

<div class="progress-step">
<span>🎨</span>
<p>Designing</p>
</div>

<div class="progress-step">
<span>🛠️</span>
<p>Making</p>
</div>

<div class="progress-step">
<span>📦</span>
<p>Ready</p>
</div>

<div class="progress-step">
<span>✅</span>
<p>Completed</p>
</div>

</div>

</section>

<button
type="button"
class="save-order">

💗 Save Order

</button>

</main>

<script src="add-order.js"></script>

</body>
</html>
