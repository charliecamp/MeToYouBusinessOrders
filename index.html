<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Me To You Designs</title>

<link rel="stylesheet" href="css/style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&family=Cormorant+Garamond:wght@400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="backgroundGlow"></div>

<div class="loginWrapper">

<img
src="logo.PNG"
class="logo"
alt="Me To You Designs">

<h1>

Welcome Back

</h1>

<div class="divider">

<span></span>

<i class="fa-regular fa-heart"></i>

<span></span>

</div>

<p class="quote">

Made with love,<br>

personalised for every occasion.

</p>

<div class="loginCard">

<div class="lockCircle">

<i class="fa-solid fa-lock"></i>

</div>

<h2>

Enter Password

</h2>

<div class="passwordBox">

<input
type="password"
id="password"
placeholder="Enter your password">

<button
id="togglePassword"
type="button">

<i class="fa-regular fa-eye"></i>

</button>

</div>

<label class="showPassword">

<input
type="checkbox"
id="showPassword">

Show Password

</label>

<button
class="loginButton">

Sign In

</button>

</div>

<div class="footerDivider">

<span></span>

<i class="fa-regular fa-heart"></i>

<span></span>

</div>

<footer>

Me To You Designs © 2026

</footer>

</div>

<script src="js/login.js"></script>

</body>

</html>
